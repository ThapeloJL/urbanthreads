<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urban Threads | Cart</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="icon" href="./assets/bag-shopping-svgrepo-com.svg" />
  </head>
  <body>
    <header class="header">
      <nav class="navbar page-shell" aria-label="Main navigation">
        <div class="logo-wrap">
          <span class="material-symbols-outlined">menu</span>
          <a href="./index.html" class="logo">Urban Threads</a>
        </div>

        <div class="searchbar" role="search">
          <span class="material-symbols-outlined search-icon">search</span>
          <input type="search" placeholder="Search products" aria-label="Search products" />
        </div>

        <div class="nav-actions">
          <span class="material-symbols-outlined">favorite</span>
          <a id="cart-link" href="./cart.html" aria-label="Open cart" hidden>Cart</a>
          <a id="login-link" href="./login.html" aria-label="Login to your account">Log in</a>
          <span id="user-label" hidden></span>
          <button id="logout-btn" type="button" hidden>Log out</button>
        </div>
      </nav>
    </header>

    <main class="page-shell cart-page">
      <div class="cart-header">
        <h1>Your cart</h1>
      </div>

      <div class="cart-layout">
        <section class="cart-items" id="cart-items" aria-live="polite"></section>

        <aside class="cart-summary" aria-label="Cart summary">
          <h2>Order summary</h2>
          <div class="summary-row">
            <span>Items</span>
            <strong id="cart-count">0</strong>
          </div>
          <div class="summary-row">
            <span>Subtotal</span>
            <strong id="cart-subtotal">$0.00</strong>
          </div>
          <button class="primary-btn" id="checkout-btn" type="button">Proceed to checkout</button>
        </aside>
      </div>
    </main>

    <script type="module" src="./js/navbar.js"></script>
    <script type="module" src="./pages/cart.js"></script>
  </body>
</html>
